<!DOCTYPE html>
<html>

<head>

    <title>HR Dashboard</title>

    <link rel="stylesheet" href="css/hr-dashboard.css">

</head>


<body>


<div class="container">


    <h1>HR Dashboard</h1>



    <!-- Dashboard Cards -->

    <div class="dashboard-cards">


        <div class="card">
            <h3>Total Employees</h3>
            <p id="totalEmployees">0</p>
        </div>



        <div class="card">
            <h3>Present Today</h3>
            <p id="presentToday">0</p>
        </div>



        <div class="card">
            <h3>Employees On Leave</h3>
            <p id="employeesLeave">0</p>
        </div>



        <div class="card">
            <h3>Pending Leaves</h3>
            <p id="pendingLeaves">0</p>
        </div>



        <div class="card">
            <h3>Departments</h3>
            <p id="totalDepartments">0</p>
        </div>



        <div class="card">
            <h3>Active Employees</h3>
            <p id="activeEmployees">0</p>
        </div>



    </div>




    <!-- Recent Activities -->


    <h2>Recent Activities</h2>



    <table>


        <thead>

            <tr>
                <th>Type</th>
                <th>Details</th>
                <th>Date</th>
            </tr>

        </thead>


        <tbody id="activityTable">

        </tbody>


    </table>



</div>



<script src="js/hr-dashboard.js"></script>


</body>

</html>
