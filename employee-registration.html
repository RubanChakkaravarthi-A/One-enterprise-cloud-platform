<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Registration | One Enterprise Cloud </title>

<link rel="stylesheet" href="css/register.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="container">

<div class="logo">

One Enterprise Cloud 

</div>

<nav>

<a href="index.html">Home</a>

<a href="#">Modules</a>

<a href="#">Solutions</a>

<a href="#">About</a>

<a href="#">Contact</a>

</nav>

</div>

</header>

<section class="registration-section">

<div class="container">

<div class="form-card">

<div class="form-header">

<h1>Employee Registration</h1>

<p>

Complete the registration form to become part of the One Enterprise Cloud Platform.

</p>

</div>

<form>

<div class="form-grid">

<div class="form-group">

<label>Employee ID</label>

<input type="text" placeholder="EMP001" required>

</div>

<div class="form-group">

<label>Full Name</label>

<input type="text" placeholder="Enter Full Name" required>

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email" placeholder="example@email.com" required>

</div>

<div class="form-group">

<label>Mobile Number</label>

<input type="tel" placeholder="9876543210" required>

</div>

<div class="form-group">

<label>Department</label>

<select required>

<option>Select Department</option>

<option>HR</option>

<option>Development</option>

<option>Testing</option>

<option>Support</option>

<option>Finance</option>

<option>Marketing</option>

</select>

</div>

<div class="form-group">

<label>Designation</label>

<input type="text" placeholder="Software Engineer">

</div>

<div class="form-group">

<label>Date of Joining</label>

<input type="date">

</div>

<div class="form-group">

<label>Gender</label>

<select>

<option>Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="form-group">

<label>Password</label>

<input type="password" placeholder="Enter Password">

</div>

<div class="form-group">

<label>Confirm Password</label>

<input type="password" placeholder="Confirm Password">

</div>

</div>

<div class="button-group">

<button type="submit" class="register-btn">

Register

</button>

<button type="reset" class="reset-btn">

Reset

</button>

</div>

</form>

</div>

</div>

</section>

<footer>

<div class="container">

<p>

©️ 2026 One Enterprise Cloud Platform. All Rights Reserved.

</p>

</div>

</footer>

</body>

</html>
